# neppie-clips — copy to /etc/nginx/sites-available/, edit the three __PLACEHOLDERS__,
# then: ln -s /etc/nginx/sites-available/neppie-clips.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# For HTTPS, run `certbot --nginx -d __DOMAIN__` afterwards; it rewrites this block.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEB_ROOT__;
    index index.html;

    # allow large video responses to stream without buffering to disk
    client_max_body_size 0;

    # The bare document goes through Node so it can inject per-clip link-preview
    # tags for ?video=<id>. If Node is down, fall back to the static index.html.
    location = / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_index;
    }
    location @static_index {
        try_files /index.html =404;
    }

    # SPA — static assets first, fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin page (plain UI, no data) + its API (basic auth; the page sends
    # the credentials itself and remembers them). Create the password file:
    #   printf 'nemu:%s\n' "$(openssl passwd -apr1)" | sudo tee /etc/nginx/neppie-admin.htpasswd
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files /admin.html =404;
    }
    location = /admin.html {
        return 404;
    }
    location /api/admin/ {
        auth_basic "neppie admin";
        auth_basic_user_file /etc/nginx/neppie-admin.htpasswd;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header X-Admin-Auth nginx;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → Node (pm2), PORT from apps/api/.env.production
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media served straight from disk (__CLIPS_DIR__ = CLIPS_DIR from the .env files)
    location /media/videos/ {
        alias __CLIPS_DIR__/videos/;
        access_log off;
        expires 7d;
    }
    location /media/thumbnails/ {
        alias __CLIPS_DIR__/thumbnails/;
        access_log off;
        expires 30d;
    }
}
